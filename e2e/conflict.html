<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Conflict E2E fixture</title></head>
  <body>
    <label>Markdown <textarea aria-label="Markdown"># Shared map</textarea></label>
    <button type="button" id="save">Save competing revision</button>
    <script type="module">
      const draft = document.querySelector('textarea');
      const save = document.querySelector('#save');
      const channel = new BroadcastChannel('markmap-aws-e2e-conflict');
      let localAtLastSave = draft.value;

      function showConflict(remoteMarkdown) {
        if (draft.value === localAtLastSave) {
          draft.value = remoteMarkdown;
          localAtLastSave = remoteMarkdown;
          return;
        }
        const dialog = document.createElement('section');
        dialog.setAttribute('role', 'dialog');
        dialog.setAttribute('aria-label', 'Remote change detected');
        dialog.innerHTML = '<p></p><pre></pre><pre></pre><button type="button">Use remote</button>';
        dialog.querySelector('p').textContent = 'A competing browser context saved a revision.';
        dialog.querySelectorAll('pre')[0].textContent = draft.value;
        dialog.querySelectorAll('pre')[1].textContent = remoteMarkdown;
        dialog.querySelector('button').addEventListener('click', () => {
          draft.value = remoteMarkdown;
          localAtLastSave = remoteMarkdown;
          dialog.remove();
        });
        document.body.append(dialog);
      }

      channel.addEventListener('message', (event) => showConflict(event.data));
      save.addEventListener('click', () => {
        localAtLastSave = draft.value;
        channel.postMessage(draft.value);
      });
    </script>
  </body>
</html>
