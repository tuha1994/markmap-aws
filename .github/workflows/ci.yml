name: CI

on:
  workflow_dispatch:
    inputs:
      prepare_pages_artifact:
        description: Upload a guarded Pages artifact after verification; does not deploy
        required: true
        default: false
        type: boolean
      approved_ref:
        description: Approved commit SHA, tag, or branch for artifact preparation
        required: false
        default: ""
        type: string
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Firestore Security Rules tests
        run: npm run test:rules

      - name: Install Chromium for headless E2E
        run: npm run test:e2e:install

      - name: Browser E2E tests
        run: npm run test:e2e

      - name: Build Pages artifact
        run: npm run build

  prepare-pages-artifact:
    name: Prepare guarded Pages artifact
    if: ${{ inputs.prepare_pages_artifact }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      PLAYWRIGHT_BROWSERS_PATH: "0"
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
    steps:
      - name: Check out approved ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.approved_ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium for headless E2E
        run: npm run test:e2e:install

      - name: Verify approved ref
        run: |
          npm run lint
          npm run typecheck
          npm run test:all

      - name: Build approved static site
        run: npm run build

      - name: Configure Pages metadata without enablement
        uses: actions/configure-pages@v5
        with:
          enablement: false

      - name: Upload dist as Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Hold deployment for separate release approval
        run: |
          echo "Pages artifact uploaded for approved ref: ${{ inputs.approved_ref || github.sha }}"
          echo "This job intentionally does not invoke actions/deploy-pages."
          echo "Production deployment requires separate release authorization."
